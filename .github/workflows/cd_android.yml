name: CD Android

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cd-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_distribute:
    name: Build & Distribute to Firebase App Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup FVM + Flutter
        uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Compute version
        id: version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f1,2)
          PATCH="${{ github.run_number }}"
          echo "version_name=${MAJOR_MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Get commit message
        id: commit
        run: echo "message=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Cache Fastlane gems
        uses: actions/cache@v4
        with:
          path: android/vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('android/Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-

      - name: Install Fastlane dependencies
        working-directory: android
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Decode Firebase service account
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 -d > android/firebase-service-account.json

      - name: Distribute via Fastlane
        working-directory: android
        run: bundle exec fastlane android distribute_firebase
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_FILE: firebase-service-account.json
          FIREBASE_TESTERS: guichodevs@gmail.com
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_NOTES: "${{ steps.commit.outputs.message }} (${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.build_number }})"

      - name: Clean up service account
        if: always()
        run: rm -f android/firebase-service-account.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
