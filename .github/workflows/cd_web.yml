name: CD Web

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cd-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM + Flutter
        uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      # El secret está guardado en base64 (igual que en cd_android.yml).
      - name: Decode Firebase service account
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 -d > firebase-service-account.json

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project mis-apps-c42cc --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json

      - name: Clean up service account
        if: always()
        run: rm -f firebase-service-account.json
